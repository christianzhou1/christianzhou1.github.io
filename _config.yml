        title: Smart Plant Platform
        link: https://github.com/christianzhou1/smart-plant-platform
        link_text: github.com/christianzhou1/smart-plant-platform
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/christianzhou1/smart-plant-platform
        quote: >
          Device-to-dashboard system: ESP32 telemetry, a FastAPI and PostgreSQL API, and a React UI.
        description: |
          **Smart Plant Platform** is an end-to-end sensing stack. An ESP32 node publishes sensor readings, and a web app stores them, aggregates them, and shows the result.

          **Pipeline**
          - **ESP32 firmware in C++** reads plant and room sensors and publishes **MQTT** telemetry
          - **FastAPI** and **PostgreSQL** ingest those messages and serve time-binned history
          - The API derives **climate metrics** (VPD, PPFD, and DLI) from stored temperature, humidity, and light readings
          - A **React** dashboard shows the charts and those metrics

          **Status**
          - Runs locally and is packaged with **Docker Compose**
          - Public deployment, the mobile app, and NFC tagging are still in progress
      - layout: left
        border: weak
        title: Medical Device Supply Disruption Dashboard
        quote: >
          Two-term capstone: a predictive analytics dashboard for medical-device supply disruptions.
        description: |
          Course capstone (September 2026 – April 2027) with a healthcare supply-chain, procurement, and back-office partner.

          **Scope**
          - Building a dashboard for disruption events in medical-device supply
          - The partner has committed proprietary historical disruption data
          - Forecasting and the dashboard are in progress
      - layout: left
        title: SkySync
        link: https://skysync.christianzhou.com/
        link_text: https://skysync.christianzhou.com/
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/christianzhou1/skysync
        quote: >
          Full-stack file storage app with a Spring Boot API, PostgreSQL, and a React client.
        description: |
          **SkySync** is a file-storage application deployed on a Linux VPS.

          **Stack**
          - **Spring Boot** and **PostgreSQL** API, with **JWT** authentication and **DTO** response contracts
          - **React** and **TypeScript** client, including an OpenAPI-generated client
          - File storage on **AWS S3**
          - **Docker Compose**, **Nginx** with HTTPS, and **GitHub Actions** for unit and integration tests

