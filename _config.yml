about_content: |
  I am a Computer Science co-op student at McMaster University (B.A.Sc., April 2027; cGPA 10.2/12). I am looking for new-grad software roles and a Fall 2027 master's in applied systems.

  I build device-to-dashboard systems: firmware and MQTT on the device, a FastAPI and PostgreSQL API in the middle, and a React dashboard on top. My co-op work was a Java Spring Boot API, including response contracts, server hardening, and data automation.

  - Core skills: Java, Python, C++, TypeScript, SQL, FastAPI, Spring Boot, Docker
  - Interests: IoT telemetry, APIs, operational dashboards, and applied machine learning
  - [GitHub](https://github.com/christianzhou1) · [LinkedIn](https://linkedin.com/in/christian-zhou)

